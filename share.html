<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>文件分享 · Cloud Vault</title>
<style>
* { box-sizing: border-box; }
:root{
  --bg:#f5f7fb; --surface:#ffffff; --border:#e8ebf3; --text:#1c2130;
  --muted:#9aa1b8; --primary:#4f6ef7; --primary-dark:#3d5be0;
  --primary-soft:#eef1fe; --ok:#1a9d6b; --err:#e5484d; --radius:16px;
}
html,body{min-height:100%;}
body{
  margin:0;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#f0f3fc 0%,#f7f8fc 42%,#eef1fb 100%);
  color:var(--text);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));min-height:100dvh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
::selection{background:#cdd8ff;}

.wrap{width:min(460px,100%);}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;}
.brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#5b7cfa,#8a5bfa);display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px rgba(91,124,250,.35);}
.brand-logo svg{width:21px;height:21px;}
.brand b{font-size:15px;font-weight:700;letter-spacing:.2px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 20px 60px rgba(30,40,80,.1);overflow:hidden;animation:pop .3s cubic-bezier(.2,.9,.3,1.15);}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}

.card-top{padding:26px 24px 20px;text-align:center;border-bottom:1px solid var(--border);position:relative;}
.share-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-soft);border-radius:20px;padding:5px 11px;margin-bottom:18px;}
.share-tag svg{width:13px;height:13px;}
.file-icon{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;margin:0 auto 16px;font-size:16px;font-weight:800;letter-spacing:.5px;background:var(--bg,#eef1fe);color:var(--fg,#4f6ef7);}
.file-icon svg{width:34px;height:34px;}
.fname{font-size:17px;font-weight:700;margin:0 0 8px;word-break:break-all;line-height:1.4;}
.fmeta{font-size:12.5px;color:var(--muted);margin:0;}
.fmeta b{color:#6b7290;font-weight:600;}

.expire-box{display:flex;align-items:center;justify-content:center;gap:7px;margin:16px auto 0;font-size:12px;color:#6b7290;background:#f7f9ff;border:1px solid #eef1fa;border-radius:10px;padding:9px 14px;width:fit-content;max-width:100%;}
.expire-box svg{width:14px;height:14px;color:var(--primary);flex:0 0 14px;}
.expire-box b{color:var(--primary);font-weight:700;}

.card-body{padding:22px 24px 26px;}
.download-btn{width:100%;height:50px;border-radius:13px;background:var(--primary);color:#fff;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 8px 20px rgba(79,110,247,.3);transition:.16s;}
.download-btn:hover{background:var(--primary-dark);box-shadow:0 10px 26px rgba(79,110,247,.4);transform:translateY(-1px);}
.download-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.download-btn svg{width:19px;height:19px;}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.6;}

.progress{height:5px;border-radius:4px;background:#e8ebf5;overflow:hidden;margin-top:14px;display:none;}
.progress.show{display:block;}
.progress i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#5b7cfa,#8a5bfa);transition:width .2s;}

.state{padding:52px 24px;text-align:center;}
.state-ico{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;display:grid;place-items:center;background:#eef1fe;color:#a4b2ea;}
.state-ico.err{background:#fdeced;color:#e5484d;}
.state-ico svg{width:30px;height:30px;}
.state h2{font-size:16px;margin:0 0 10px;}
.state p{font-size:13px;color:var(--muted);margin:0;line-height:1.7;}

.spinner{width:34px;height:34px;border-radius:50%;border:3px solid #e4e8f5;border-top-color:var(--primary);animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}

.footer{text-align:center;font-size:11px;color:#aeb4c8;margin-top:20px;}

@media(max-width:480px){
  body{padding:16px 14px calc(16px + env(safe-area-inset-bottom));}
  .card-top{padding:22px 18px 18px;}
  .card-body{padding:18px 18px 22px;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>
    </div>
    <b>Cloud Vault · 文件分享</b>
  </div>

  <div class="card" id="card">
    <div id="content">
      <div class="state">
        <div class="spinner"></div>
        <p>正在验证分享链接…</p>
      </div>
    </div>
  </div>

  <div class="footer">临时分享 · 链接到期后自动失效</div>
</div>

<script>
const ICONS = {
  image  : '<rect x="3" y="4" width="18" height="16" rx="2.2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17.5 5-5 4 4 3-3 4 4"/>',
  doc    : '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/>',
  sheet  : '<rect x="3" y="4" width="18" height="16" rx="2.2"/><path d="M3 10h18M9.5 4v16"/>',
  archive: '<rect x="4" y="3" width="16" height="18" rx="2.2"/><path d="M12 3v2m0 3v2m0 3v2"/>',
  other  : '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/>',
  share  : '<circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.3 10.8 7.4-4.3M8.3 13.2l7.4 4.3"/>',
  clock  : '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.9"/>',
  download:'<path d="M12 4v12m0 0 5-5m-5 5-5-5"/><path d="M4 18v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"/>',
  warn   : '<path d="M12 8v5m0 3h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
};
function icon(name, cls=''){ return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.other}</svg>`; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(b){ b=b||0; if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(1)+' KB'; if(b<1073741824)return (b/1048576).toFixed(1)+' MB'; return (b/1073741824).toFixed(2)+' GB'; }
function getKind(name){
  const ext=(name.split('.').pop()||'').toLowerCase();
  if(['jpg','jpeg','png','gif','webp','bmp','svg','heic'].includes(ext))return 'image';
  if(['doc','docx','txt','md','pdf','rtf','pages'].includes(ext))return 'doc';
  if(['xls','xlsx','csv','numbers'].includes(ext))return 'sheet';
  if(['zip','rar','7z','tar','gz','bz2'].includes(ext))return 'archive';
  return 'other';
}
function fmtCountdown(ms){
  if(ms<=0) return '已过期';
  const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(d>0)return d+' 天 '+h+' 小时'; if(h>0)return h+' 小时 '+m+' 分'; if(m>0)return m+' 分 '+sec+' 秒'; return sec+' 秒';
}
function stateHTML(type, title, desc){
  const ico = type==='err' ? icon('warn') : icon('share');
  return `<div class="state">
    <div class="state-ico ${type==='err'?'err':''}">${ico}</div>
    <h2>${esc(title)}</h2>
    <p>${desc}</p>
  </div>`;
}

const content = document.getElementById('content');
const params = new URLSearchParams(location.search);
const token = params.get('t') || '';
let info = null;
let timer = null;

function renderFile(){
  const kind = getKind(info.name);
  const ext = (info.name.split('.').pop()||'file').toUpperCase().slice(0,4);
  const stBg = {image:'#eef1fe',doc:'#eaf6f0',sheet:'#f0f7e9',archive:'#fdf1e7',other:'#eef1fe'}[kind]||'#eef1fe';
  const stFg = {image:'#4f6ef7',doc:'#1a9d6b',sheet:'#5aa832',archive:'#e08a2e',other:'#4f6ef7'}[kind]||'#4f6ef7';
  content.innerHTML = `
    <div class="card-top">
      <span class="share-tag">${icon('share')} 临时分享文件</span>
      <div class="file-icon" style="--bg:${stBg};--fg:${stFg}"><span>${esc(ext)}</span></div>
      <h1 class="fname" title="${esc(info.name)}">${esc(info.name)}</h1>
      <p class="fmeta">文件大小 <b>${fmtSize(info.size)}</b></p>
      <div class="expire-box">${icon('clock')} 有效期剩余 <b id="countdown">--</b></div>
      ${info.remainingDownloads !== null ? `<div class="expire-box" style="margin-top:8px">${icon('download')} 剩余可下载 <b id="remainCount">${info.remainingDownloads}</b> 次</div>` : ''}
    </div>
    <div class="card-body">
      <button class="download-btn" id="dlBtn">${icon('download')} 下载文件</button>
      <div class="progress" id="progress"><i id="progressFill"></i></div>
      <p class="hint">点击即可保存到本地 · 链接到期后自动失效</p>
    </div>`;
  document.getElementById('dlBtn').addEventListener('click', download);
  const tick = () => {
    const left = info.expiresAt - Date.now();
    const el = document.getElementById('countdown');
    if (!el) return;
    el.textContent = fmtCountdown(left);
    if (left <= 0){
      if (timer){ clearInterval(timer); timer = null; }
      showExpired();
    }
  };
  tick();
  timer = setInterval(tick, 1000);
}

function showExpired(){
  if (timer){ clearInterval(timer); timer = null; }
  content.innerHTML = stateHTML('err','链接已过期','这个分享链接已到有效期，无法继续下载。<br>请联系分享者重新生成一个新的链接。');
}

async function loadInfo(){
  if (!token){
    content.innerHTML = stateHTML('err','链接无效','链接中缺少分享标识，请检查是否复制了完整的网址。');
    return;
  }
  try {
    const resp = await fetch('/api/sign', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'share_info', token })
    });
    const data = await resp.json().catch(()=>({}));
    if (!resp.ok || data.error){
      const msg = data.error || '无法验证此分享链接';
      let title = '链接无效或已被篡改';
      if (resp.status === 410 || /过期/.test(msg)) title = '链接已过期';
      else if (/撤销/.test(msg)) title = '链接已被撤销';
      else if (/次数/.test(msg)) title = '下载次数已用完';
      else if (/删除/.test(msg)) title = '文件已被删除';
      content.innerHTML = stateHTML('err', title,
        msg + '<br>如需下载，请联系分享者重新生成链接。');
      return;
    }
    info = data;
    renderFile();
  } catch (e) {
    content.innerHTML = stateHTML('err','无法连接服务器','网络异常，请稍后重试。<br><span style="font-size:11px">'+esc(e.message)+'</span>');
  }
}

async function download(){
  const btn = document.getElementById('dlBtn');
  const prog = document.getElementById('progress');
  const fill = document.getElementById('progressFill');
  btn.disabled = true;
  btn.innerHTML = '正在准备文件…';
  prog.classList.add('show');
  fill.style.width = '35%';
  try {
    const resp = await fetch('/api/sign', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'share_download', token })
    });
    if (!resp.ok){
      const msg = (await resp.text()).slice(0,120);
      // 次数用尽/撤销/删除 → 切换到状态页，按钮置灰
      if (/次数|撤销|删除|过期/.test(msg)){
        let title = '链接已失效';
        if (/次数/.test(msg)) title = '下载次数已用完';
        else if (/撤销/.test(msg)) title = '链接已被撤销';
        else if (/删除/.test(msg)) title = '文件已被删除';
        else if (/过期/.test(msg)) title = '链接已过期';
        if (timer){ clearInterval(timer); timer = null; }
        content.innerHTML = stateHTML('err', title, msg + '<br>如需下载，请联系分享者重新生成链接。');
        return;
      }
      throw new Error(msg || ('HTTP '+resp.status));
    }
    fill.style.width = '80%';
    const blob = await resp.blob();
    fill.style.width = '100%';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = info.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 8000);
    // 有限次：更新剩余次数显示，用完则禁用按钮
    if (info.remainingDownloads !== null){
      info.remainingDownloads = Math.max(0, info.remainingDownloads - 1);
      const rc = document.getElementById('remainCount');
      if (rc) rc.textContent = info.remainingDownloads;
      if (info.remainingDownloads <= 0){
        btn.disabled = true;
        btn.innerHTML = '下载次数已用完';
        setTimeout(()=>{
          if (timer){ clearInterval(timer); timer = null; }
          content.innerHTML = stateHTML('err','下载次数已用完','这个分享链接的下载次数已用完。<br>如需继续下载，请联系分享者重新生成链接。');
        }, 1200);
        return;
      }
    }
    btn.disabled = false;
    btn.innerHTML = icon('download') + ' 再次下载';
    setTimeout(()=>{ prog.classList.remove('show'); fill.style.width='0'; }, 800);
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = icon('download') + ' 重试下载';
    prog.classList.remove('show');
    alert('下载失败：' + e.message);
  }
}

loadInfo();
</script>
</body>
</html>
